name: Claude

# Mention @claude in a PR or issue comment to get help: "@claude review this",
# "@claude why is CI failing?", "@claude implement this issue".
# Setup: run `/install-github-app` in Claude Code, or add a CLAUDE_CODE_OAUTH_TOKEN repo secret
# (from `claude setup-token`). See docs/setup.md. Without the secret this workflow only fails when someone mentions @claude.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only the repo's own people can trigger it, AND the thread it acts on must be authored by one of
    # them. Otherwise a trusted "@claude fix this" on an outsider's issue would feed that outsider's text
    # to an agent with write access (prompt injection). Each event is gated on its own fields.
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'issues' &&
        contains(github.event.issue.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token: write is required: claude-code-action exchanges an OIDC token for its GitHub App token.
    # PRs the agent opens are bot-authored, so automerge.yml never merges them without a human.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
