name: Bug
description: Something is broken or behaves wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Device / browser / OS / URL / commit — whatever pins it down
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs, Sentry link
